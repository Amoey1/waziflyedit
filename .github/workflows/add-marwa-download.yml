name: Install locked Marwa final song
on:
  push:
    branches:
      - marwa-graduation-2026
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: marwa-graduation-2026
      - name: Install exact approved MP3
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="4db61894584cc885fb1b7c54dee8a0ce8dc1f98ba9a276d657c6021b7bae48a7"
          FINAL="marwa-final-song.mp3"
          if [ -f "$FINAL" ]; then
            ACTUAL="$(sha256sum "$FINAL" | awk '{print $1}')"
          else
            ACTUAL=""
          fi
          if [ "$ACTUAL" != "$EXPECTED_SHA" ]; then
            curl -fL --retry 4 --retry-delay 2               "https://cdn1.suno.ai/5878b6d7-f65b-4fd2-87a3-d978e96fe324.mp3"               -o "$FINAL.tmp"
            ACTUAL="$(sha256sum "$FINAL.tmp" | awk '{print $1}')"
            if [ "$ACTUAL" != "$EXPECTED_SHA" ]; then
              echo "Downloaded audio hash mismatch: $ACTUAL"
              rm -f "$FINAL.tmp"
              exit 1
            fi
            mv "$FINAL.tmp" "$FINAL"
          fi
          rm -f marwa-song.mp3 "فرحة الليلة (2).mp3"
      - name: Commit exact locked MP3
        shell: bash
        run: |
          if git diff --quiet -- . && [ -z "$(git status --porcelain)" ]; then
            echo "Exact final MP3 already installed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install locked final Marwa song"
          git push origin HEAD:marwa-graduation-2026
