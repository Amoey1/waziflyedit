name: Patch Marwa page
on:
  push:
    branches:
      - marwa-graduation-2026
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: marwa-graduation-2026
      - name: Switch to latest Marwa song
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('marwa.html')
          s = p.read_text(encoding='utf-8')

          OLD = 'https://cdn1.suno.ai/52c92fdc-2c8b-4355-9617-537ec09e8f92.mp3'
          NEW = 'https://cdn1.suno.ai/5878b6d7-f65b-4fd2-87a3-d978e96fe324.mp3'

          if OLD not in s and NEW not in s:
              raise SystemExit('Expected song URL not found in marwa.html')

          s = s.replace(OLD, NEW)
          s = s.replace('رحلة خاصة جدًا • لمروى فقط 🤍', 'رحلة خاصة جدًا • لمروى 🤍')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit updated song
        shell: bash
        run: |
          if git diff --quiet -- marwa.html; then
            echo "Latest song already active"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marwa.html
          git commit -m "Replace Marwa song with latest uploaded version"
          git push origin HEAD:marwa-graduation-2026
