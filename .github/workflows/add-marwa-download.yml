name: Build Marwa motion version
on:
  push:
    branches:
      - marwa-graduation-2026
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: marwa-graduation-2026
      - name: Build motion page
        run: python .github/scripts/build_marwa_motion.py
      - name: Ensure start button is visible
        run: python .github/scripts/fix_marwa_motion_start_button.py
      - name: Commit motion page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marwa-motion.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix Marwa motion start button visibility"
          git push origin HEAD:marwa-graduation-2026
