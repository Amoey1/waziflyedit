name: Patch Marwa page
on:
  push:
    branches:
      - marwa-graduation-2026
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: marwa-graduation-2026
      - name: Add study analysis transition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('marwa.html')
          s = p.read_text(encoding='utf-8')

          # Preserve the latest song and existing opening correction.
          s = s.replace('https://cdn1.suno.ai/5878b6d7-f65b-4fd2-87a3-d978e96fe324.mp3', 'https://cdn1.suno.ai/de8cdd97-18b4-423f-87e3-da4d6dbd8667.mp3')
          s = s.replace('رحلة خاصة جدًا • لمروى فقط 🤍', 'رحلة خاصة جدًا • لمروى 🤍')

          # IDEA 1 ONLY: add a playful study-analysis interstitial between scenes 3 and 4.
          if 'id="studyAnalysisOverlay"' not in s:
              old_button = '<button class="btn" onclick="go(4)">كمّلي 👀</button>'
              new_button = '<button class="btn" onclick="studyAnalysis()">كمّلي 👀</button>'
              if old_button not in s:
                  raise SystemExit('Stage 3 continue button not found')
              s = s.replace(old_button, new_button, 1)

              extra_css = '''.analysis-overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 18%,rgba(199,165,90,.16),transparent 28%),linear-gradient(155deg,#1e1015,#0f090c);opacity:0;visibility:hidden;transition:opacity .35s ease}.analysis-overlay.show{opacity:1;visibility:visible}.analysis-card{width:min(560px,100%);padding:30px 24px;border-radius:28px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.11);box-shadow:0 30px 80px rgba(0,0,0,.35);backdrop-filter:blur(18px);text-align:center;color:#fff}.analysis-icon{font-size:46px;margin-bottom:10px;animation:f 2.4s ease-in-out infinite}.analysis-title{font-size:clamp(23px,6vw,34px);font-weight:900;margin:0 0 9px;color:#fff}.analysis-sub{font-size:14px;color:#d7c7cc;min-height:27px;margin-bottom:20px}.analysis-percent{font-size:clamp(58px,18vw,96px);font-weight:900;line-height:1;color:#f1d797;text-shadow:0 0 28px rgba(224,190,108,.18);font-variant-numeric:tabular-nums}.analysis-track{height:11px;background:rgba(255,255,255,.10);border-radius:99px;overflow:hidden;margin:18px 0 16px}.analysis-fill{height:100%;width:0;background:linear-gradient(90deg,#b66c7e,#d8bd75);border-radius:inherit;transition:width .7s cubic-bezier(.2,.8,.2,1)}.analysis-result{display:none;padding:15px 14px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.09);color:#fff3dc;line-height:1.8;animation:p .4s ease}.analysis-result.show{display:block}.analysis-result b{color:#f3d88f}'''
              s = s.replace('</style>', extra_css + '</style>', 1)

              overlay = '''<div class="analysis-overlay" id="studyAnalysisOverlay" aria-hidden="true"><div class="analysis-card"><div class="analysis-icon">🧠📚</div><div class="analysis-title">جارٍ تحليل سنوات الدراسة…</div><div class="analysis-sub" id="analysisStatus">فتح ملفات الرحلة...</div><div class="analysis-percent" id="analysisPercent">12%</div><div class="analysis-track"><div class="analysis-fill" id="analysisFill"></div></div><div class="analysis-result" id="analysisResult"><div>النظام تعب هو كمان من كمية الضغط اللي تحملتيه 😂</div><div style="margin-top:7px"><b>النتيجة: تستحقين التخرج رسميًا ✅</b></div></div></div></div>'''
              marker = '<script>let cur=1;'
              if marker not in s:
                  raise SystemExit('Main script marker not found')
              s = s.replace(marker, overlay + marker, 1)

              js = '''function studyAnalysis(){const o=$('studyAnalysisOverlay'),pct=$('analysisPercent'),fill=$('analysisFill'),st=$('analysisStatus'),res=$('analysisResult');o.classList.add('show');o.setAttribute('aria-hidden','false');res.classList.remove('show');const steps=[{p:12,t:'فتح ملفات الرحلة...'}, {p:46,t:'حساب عدد مرات «خلاص… أنا تعبت» 😂'}, {p:87,t:'فحص مستوى الصبر والتحمّل...'}, {p:99,t:'لحظة… النظام يحاول يستوعب كل هذا 👀'}];let i=0;function run(){const x=steps[i];pct.textContent=x.p+'%';fill.style.width=x.p+'%';st.textContent=x.t;if(i<steps.length-1){i++;setTimeout(run,780)}else{setTimeout(()=>{st.textContent='اكتمل التحليل تقريبًا…';res.classList.add('show');hearts(6);setTimeout(()=>{fill.style.width='100%';pct.textContent='100%';st.textContent='تم اعتماد النتيجة 🎓';setTimeout(()=>{o.classList.remove('show');o.setAttribute('aria-hidden','true');go(4)},1100)},1450)},1350)}}requestAnimationFrame(()=>{fill.style.width='12%';run()})}'''
              s = s.replace('function q4(', js + 'function q4(', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit Marwa page update
        shell: bash
        run: |
          if git diff --quiet -- marwa.html; then
            echo "Study analysis transition already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marwa.html
          git commit -m "Add playful study analysis between stages 3 and 4"
          git push origin HEAD:marwa-graduation-2026
