name: Fix Marwa audio delivery
on:
  push:
    branches:
      - marwa-graduation-2026
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: marwa-graduation-2026
      - name: Rename MP3 and update Marwa page
        shell: bash
        run: |
          set -e
          if [ -f "فرحة الليلة (2).mp3" ] && [ ! -f "marwa-song.mp3" ]; then
            git mv "فرحة الليلة (2).mp3" marwa-song.mp3
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('marwa.html')
          s = p.read_text(encoding='utf-8')
          old_urls = [
              'https://cdn1.suno.ai/de8cdd97-18b4-423f-87e3-da4d6dbd8667.mp3',
              'https://cdn1.suno.ai/5878b6d7-f65b-4fd2-87a3-d978e96fe324.mp3',
              'https://raw.githubusercontent.com/Amoey1/waziflyedit/marwa-graduation-2026/%D9%81%D8%B1%D8%AD%D8%A9%20%D8%A7%D9%84%D9%84%D9%8A%D9%84%D8%A9%20%282%29.mp3',
          ]
          new = 'https://cdn.jsdelivr.net/gh/Amoey1/waziflyedit@marwa-graduation-2026/marwa-song.mp3'
          for u in old_urls:
              s = s.replace(u, new)
          if new not in s:
              raise SystemExit('Could not set Marwa audio URL')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit audio delivery fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marwa.html marwa-song.mp3 "فرحة الليلة (2).mp3" 2>/dev/null || true
          git add -A
          git commit -m "Fix Marwa audio playback on iPhone"
          git push origin HEAD:marwa-graduation-2026
