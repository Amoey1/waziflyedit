name: Patch Marwa page
on:
  push:
    branches:
      - marwa-graduation-2026
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: marwa-graduation-2026
      - name: Force manual analysis gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('marwa.html')
          s = p.read_text(encoding='utf-8')

          # Keep current content choices intact.
          s = s.replace('رحلة خاصة جدًا • لمروى فقط 🤍', 'رحلة خاصة جدًا • لمروى 🤍')
          s = s.replace('https://cdn1.suno.ai/5878b6d7-f65b-4fd2-87a3-d978e96fe324.mp3', 'https://cdn1.suno.ai/de8cdd97-18b4-423f-87e3-da4d6dbd8667.mp3')

          # Make the button text explicit and highly visible.
          s = re.sub(
              r'<button class="btn gold analysis-continue" id="analysisContinue" onclick="finishStudyAnalysis\(\)">.*?</button>',
              '<button class="btn gold analysis-continue" id="analysisContinue" onclick="finishStudyAnalysis()">اضغطي هنا عشان نكمّل 👀</button>',
              s,
              count=1
          )

          # Stronger pop + pulse animation.
          s = re.sub(
              r'\.analysis-continue\{[^}]*\}',
              '.analysis-continue{margin-top:18px;transform-origin:center;animation:analysisPop .55s .18s both,analysisPulse 1.7s .85s ease-in-out infinite;box-shadow:0 0 0 0 rgba(210,184,109,.35)}',
              s,
              count=1
          )
          if '@keyframes analysisPulse' not in s:
              s = s.replace('</style>', '@keyframes analysisPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(210,184,109,.28)}50%{transform:scale(1.035);box-shadow:0 0 0 12px rgba(210,184,109,0)}}</style>', 1)

          # Absolutely no transition to scene 4 from studyAnalysis itself.
          manual_js = '''function studyAnalysis(){const o=$('studyAnalysisOverlay'),pct=$('analysisPercent'),fill=$('analysisFill'),st=$('analysisStatus'),res=$('analysisResult'),btn=$('analysisContinue');o.classList.add('show');o.setAttribute('aria-hidden','false');res.classList.remove('show');if(btn){btn.disabled=false;btn.textContent='اضغطي هنا عشان نكمّل 👀'}const steps=[{p:12,t:'فتح ملفات الرحلة...'},{p:46,t:'حساب عدد مرات «خلاص… أنا تعبت» 😂'},{p:87,t:'فحص مستوى الصبر والتحمّل...'},{p:99,t:'لحظة… النظام يحاول يستوعب كل هذا 👀'}];let i=0;function run(){const x=steps[i];pct.textContent=x.p+'%';fill.style.width=x.p+'%';st.textContent=x.t;if(i<steps.length-1){i++;setTimeout(run,780);return}setTimeout(()=>{st.textContent='خذي وقتك واقرئي النتيجة 👇';res.classList.add('show');hearts(6)},1350)}requestAnimationFrame(()=>{fill.style.width='12%';run()})}function finishStudyAnalysis(){const o=$('studyAnalysisOverlay');o.classList.remove('show');o.setAttribute('aria-hidden','true');go(4)}'''

          pattern = r"function studyAnalysis\(\)\{.*?\}function q4\("
          if not re.search(pattern, s, flags=re.S):
              raise SystemExit('studyAnalysis block not found')
          s = re.sub(pattern, manual_js + 'function q4(', s, count=1, flags=re.S)

          # Safety check: no go(4) is allowed inside studyAnalysis.
          block = s.split('function studyAnalysis(){',1)[1].split('function finishStudyAnalysis(){',1)[0]
          if 'go(4)' in block:
              raise SystemExit('Safety check failed: automatic go(4) still present in studyAnalysis')

          p.write_text(s, encoding='utf-8')
          # Publish under a fresh filename to defeat htmlpreview/browser caching.
          Path('marwa-fresh.html').write_text(s, encoding='utf-8')
          PY
      - name: Commit fresh manual-gate page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marwa.html marwa-fresh.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Require Marwa to press continue after study analysis"
          git push origin HEAD:marwa-graduation-2026
