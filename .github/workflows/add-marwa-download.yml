name: Patch Marwa page
on:
  push:
    branches:
      - marwa-graduation-2026
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: marwa-graduation-2026
      - name: Make analysis wait for user
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('marwa.html')
          s = p.read_text(encoding='utf-8')

          # Preserve current latest song and opening text.
          s = s.replace('https://cdn1.suno.ai/5878b6d7-f65b-4fd2-87a3-d978e96fe324.mp3', 'https://cdn1.suno.ai/de8cdd97-18b4-423f-87e3-da4d6dbd8667.mp3')
          s = s.replace('رحلة خاصة جدًا • لمروى فقط 🤍', 'رحلة خاصة جدًا • لمروى 🤍')

          old_result = '<div class="analysis-result" id="analysisResult"><div>النظام تعب هو كمان من كمية الضغط اللي تحملتيه 😂</div><div style="margin-top:7px"><b>النتيجة: تستحقين التخرج رسميًا ✅</b></div></div>'
          new_result = '<div class="analysis-result" id="analysisResult"><div>النظام تعب هو كمان من كمية الضغط اللي تحملتيه 😂</div><div style="margin-top:7px"><b>النتيجة: تستحقين التخرج رسميًا ✅</b></div><button class="btn gold analysis-continue" id="analysisContinue" onclick="finishStudyAnalysis()">كمّلي الرحلة 👀</button></div>'
          if old_result in s:
              s = s.replace(old_result, new_result, 1)

          if '.analysis-continue{' not in s:
              css = '.analysis-continue{margin-top:16px;transform-origin:center;animation:analysisPop .5s .25s both}@keyframes analysisPop{0%{opacity:0;transform:scale(.72) translateY(8px)}70%{opacity:1;transform:scale(1.06) translateY(0)}100%{opacity:1;transform:scale(1)}}'
              s = s.replace('</style>', css + '</style>', 1)

          new_js = '''function studyAnalysis(){const o=$('studyAnalysisOverlay'),pct=$('analysisPercent'),fill=$('analysisFill'),st=$('analysisStatus'),res=$('analysisResult'),btn=$('analysisContinue');o.classList.add('show');o.setAttribute('aria-hidden','false');res.classList.remove('show');if(btn){btn.disabled=false;btn.textContent='كمّلي الرحلة 👀'}const steps=[{p:12,t:'فتح ملفات الرحلة...'}, {p:46,t:'حساب عدد مرات «خلاص… أنا تعبت» 😂'}, {p:87,t:'فحص مستوى الصبر والتحمّل...'}, {p:99,t:'لحظة… النظام يحاول يستوعب كل هذا 👀'}];let i=0;function run(){const x=steps[i];pct.textContent=x.p+'%';fill.style.width=x.p+'%';st.textContent=x.t;if(i<steps.length-1){i++;setTimeout(run,780)}else{setTimeout(()=>{st.textContent='اكتمل التحليل تقريبًا…';res.classList.add('show');hearts(6)},1350)}}requestAnimationFrame(()=>{fill.style.width='12%';run()})}function finishStudyAnalysis(){const o=$('studyAnalysisOverlay'),pct=$('analysisPercent'),fill=$('analysisFill'),st=$('analysisStatus'),btn=$('analysisContinue');if(btn){btn.disabled=true;btn.textContent='تم الاعتماد ✅'}fill.style.width='100%';pct.textContent='100%';st.textContent='تم اعتماد النتيجة 🎓';hearts(5);setTimeout(()=>{o.classList.remove('show');o.setAttribute('aria-hidden','true');go(4)},850)}'''

          pattern = r"function studyAnalysis\(\)\{.*?\}function q4\("
          if re.search(pattern, s, flags=re.S):
              s = re.sub(pattern, new_js + 'function q4(', s, count=1, flags=re.S)
          else:
              raise SystemExit('studyAnalysis function not found')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit Marwa page update
        shell: bash
        run: |
          if git diff --quiet -- marwa.html; then
            echo "Analysis already waits for user"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marwa.html
          git commit -m "Make study analysis wait for Marwa before stage 4"
          git push origin HEAD:marwa-graduation-2026
