name: Build Marwa motion version
on:
  push:
    branches:
      - marwa-graduation-2026
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: marwa-graduation-2026
      - name: Build motion-enhanced copy
        run: python .github/scripts/build_marwa_motion.py
      - name: Commit motion version only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marwa-motion.html
          if git diff --cached --quiet; then
            echo "Motion version already up to date"
            exit 0
          fi
          git commit -m "Add motion enhanced Marwa graduation journey"
          git push origin HEAD:marwa-graduation-2026
